<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess The Game</title>
    <link rel="icon" type="image/svg+xml" href="Assets/logo.svg">
    <link rel="alternate icon" href="Assets/Logo.png">
    <meta name="description" content="Guess The Game - Devine le titre des jeux video a partir d'images, sons, descriptions ou silhouettes. 8 modes solo et un mode multijoueur en temps reel.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Guess The Game">
    <meta property="og:description" content="Devine le titre des jeux video. 8 modes solo + multijoueur temps reel.">
    <meta property="og:image" content="Assets/Logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Guess The Game">
    <meta name="twitter:description" content="Devine le titre des jeux video. 8 modes solo + multijoueur temps reel.">
    <meta name="twitter:image" content="Assets/Logo.png">
    <link rel="stylesheet" href="CSS/index-style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"
            integrity="sha384-fXdIufVbE9aU7STmdk/DWK0imNOozId9fTwzM/gi0NfPjphEIC3gq0M760UnsKVy"
            crossorigin="anonymous"
            referrerpolicy="no-referrer"></script>
</head>
<style>
    .logo-wrapper {
        width: 100%;
        display: flex;
        justify-content: center;
    }
    .game-logo {
        width: 500px;
        animation: floating 6s ease-in-out infinite;
    }
    @keyframes floating {
        0% {
            transform: translateY(0px);
        }
        50% {
            transform: translateY(-50px);
        }
        100% {
            transform: translateY(0px);
        }
    }
</style>

<body>
    <main id="app">
        <div class="logo-wrapper" id="logo-container"></div>
        <!-- Sélection du profil -->
        <section class="profile-selection">
            <h1>Choisissez un profil :</h1>
            <div id="profiles-container">
                <!-- Les profils seront injectés ici -->
            </div>
        </section>
        <button id="load-profile">Charger</button>
        <button id="delete-profile">Supprimer le profil selectionné</button>
        <button id="import-save-btn">📥 Importer une sauvegarde</button>
        <button id="multiplayer-btn">🎮 Multijoueur</button>
    </main>
    <script type="module" src="JS/index.js"></script>
    <script>
        const container = document.getElementById('logo-container');
        fetch('./Assets/logo.svg') 
            .then(response => response.text())
            .then(svgContent => {
                container.innerHTML = svgContent;
                anime({
                    targets: '.game-logo path, .game-logo rect, .game-logo polygon, .game-logo circle',
                    translateY: [-50, 0],
                    opacity: [0, 1],
                    easing: 'easeOutExpo',
                    duration: 1000,
                    delay: anime.stagger(10, { start: 500 })
                });
            })
            .catch(error => console.error('Erreur de chargement du logo:', error));
    </script>
</body>

</html>
