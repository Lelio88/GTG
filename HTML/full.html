<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Full Package Mode</title>
    <link rel="icon" type="image/svg+xml" href="../Assets/logo.svg">
    <link rel="alternate icon" href="../Assets/Logo.png">
    <link rel="stylesheet" href="../CSS/style.css">
    <script type="module" defer src="../JS/full.js"></script>
</head>

<body>
<header id="header-bar">
    <a href="../index.html">
        <img src="../Assets/Logo.png" alt="Guess The Game - Retour a l'accueil" id="header-logo">
    </a>
    <nav>
        <ul>
            <li><a href="./sound.html">Sound Only</a></li>
            <li><a href="./image.html">Image Only</a></li>
            <li><a href="./text.html">Text Only</a></li>
            <li><a href="./shadow.html">Shadow Mode</a></li>
            <li><a href="./midi.html">MIDI Mode</a></li>
            <li><a href="./pixelated.html">Pixelated Mode</a></li>
            <li><a href="./emoji.html">Emoji Mode</a></li>
            <li><a href="./hub.html">Retour au Hub</a></li>
        </ul>
    </nav>
</header>
    <div id="app">
        <div id="game">
            <h2 id="game-title"></h2>
            <h2 id="message"></h2>
            <div id="content"></div>
            <input type="text" id="user-input" placeholder="Votre réponse..." autocomplete="off" required>

            <div id="button-container">
                <button id="hint-button" onclick="showHint()">Indice</button>
                <button onclick="checkAnswer()">Valider</button>
                <button id="next-button" onclick="nextQuestion()" style="display: none;">Prochaine question</button>
            </div>
            <div id="scoreboard">
                <p>Bonnes réponses : <span id="good-answers">0</span></p>
                <p>Mauvaises réponses : <span id="bad-answers">0</span></p>
                <p>Timer : <span id="timer">00:00</span></p>
                <p id="keys-counter" style="display: none;">🔑 Clés : <span id="keys-count">0</span></p>
            </div>
        </div>
    </div>
</body>

</html>
