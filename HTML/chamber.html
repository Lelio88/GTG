<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chambre - Recherche d'indices</title>
    <link rel="stylesheet" href="../CSS/chamber.css">
</head>
<body>

    <div id="scene-container">
        <img src="../ASSETS/chambre.png" alt="Chambre" id="room-background">
        
        <div class="clickable-area" id="zone-pixelated" data-mode="pixelated"></div>
        <div class="clickable-area" id="zone-emoji" data-mode="emoji"></div>
        <div class="clickable-area" id="zone-shadow" data-mode="shadow"></div>
        <div class="clickable-area" id="zone-midi" data-mode="midi"></div>
        <div class="clickable-area" id="zone-trophy" data-mode="trophy"></div>
        <div class="clickable-area" id="zone-calculator" data-mode="calculator"></div>
        <div class="clickable-area" id="zone-pantone" data-mode="pantone"></div>
        <div class="clickable-area" id="zone-films" data-mode="films"></div>
        <div class="clickable-area" id="zone-gto" data-mode="gto"></div>
        <div class="clickable-area" id="zone-xxx" data-mode="xxx"></div>

        <button id="back-hub">Retour au Hub</button>

        <div id="confirmation-modal" class="modal hidden">
            <div class="modal-content">
                <p>Voulez-vous vraiment ouvrir ce tiroir ?</p>
                <div class="modal-buttons">
                    <button id="confirm-btn">Oui (Utiliser la clé)</button>
                    <button id="cancel-btn">Non</button>
                </div>
            </div>
        </div>
    </div>

    <script type="module" src="../JS/chamber.js"></script>
</body>
</html>
