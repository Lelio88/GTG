<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Multijoueur — GTG</title>
    <link rel="icon" type="image/svg+xml" href="../Assets/logo.svg">
    <link rel="alternate icon" href="../Assets/Logo.png">
    <meta name="description" content="Mode multijoueur de Guess The Game. Cree ou rejoins une partie en temps reel avec tes amis.">
    <link rel="stylesheet" href="../CSS/multi.css">
    <script type="module" src="../JS/multi/lobby-entry.js"></script>
</head>

<body>
    <main id="app" class="multi-lobby-app">
        <h1>Mode Multijoueur</h1>

        <section class="multi-section" id="alias-section">
            <label for="alias-input">Ton pseudo</label>
            <input type="text" id="alias-input" maxlength="20" placeholder="20 caractères max" autocomplete="off" />
        </section>

        <section class="multi-section" id="create-section">
            <h2>Créer une room</h2>
            <label for="mode-select">Mode de jeu</label>
            <select id="mode-select">
                <option value="full">Full Package</option>
                <option value="image">Image Only</option>
                <option value="sound">Sound Only</option>
                <option value="text">Text Only</option>
                <option value="pixelated">Pixelated</option>
                <option value="shadow">Shadow</option>
                <option value="midi">MIDI</option>
                <option value="emoji">Emoji</option>
            </select>

            <label for="games-select">Nombre de manches</label>
            <select id="games-select">
                <option value="10">10 manches</option>
                <option value="20" selected>20 manches</option>
                <option value="30">30 manches</option>
            </select>

            <button id="create-room-btn">Créer la room</button>
        </section>

        <section class="multi-section" id="join-section">
            <h2>Rejoindre une room</h2>
            <label for="code-input">Code de room</label>
            <input type="text" id="code-input" maxlength="6" placeholder="AB12CD" autocomplete="off" />
            <button id="join-room-btn">Rejoindre</button>
        </section>

        <p class="multi-error" id="error-msg"></p>

        <a href="../index.html" class="multi-back">← Retour à l'accueil</a>
    </main>
</body>

</html>
