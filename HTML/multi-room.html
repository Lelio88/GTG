<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Multijoueur — GTG</title>
    <link rel="stylesheet" href="../CSS/multi.css">
    <script type="module" defer src="../JS/multi/room-entry.js"></script>
</head>

<body>
    <div id="app" class="multi-room-app">

        <!-- Header global (toujours visible) -->
        <header class="multi-room-header">
            <div class="multi-room-header-left">
                <span class="multi-room-header-title">Room</span>
                <span class="multi-room-header-code" id="header-room-code"></span>
            </div>
            <div class="multi-room-header-actions">
                <a id="bug-report-link" class="btn-bug-report" target="_blank" rel="noopener" href="#">🐛 Signaler un bug</a>
                <button id="leave-room-btn" class="btn-leave">← Quitter</button>
            </div>
        </header>

        <!-- Sidebar (joueurs en haut + chat en bas) -->
        <aside class="multi-sidebar">
            <div id="multi-scoreboard" class="multi-scoreboard"></div>
            <div class="multi-chat">
                <h3 class="multi-chat-header">💬 Chat</h3>
                <div id="multi-chat-messages" class="multi-chat-messages">
                    <p class="multi-chat-empty">Personne n'a écrit pour l'instant…</p>
                </div>
                <form id="multi-chat-form" class="multi-chat-form" autocomplete="off">
                    <input type="text" id="multi-chat-input" class="multi-chat-input"
                           maxlength="200" placeholder="Écris un message…" />
                    <button type="submit" id="multi-chat-send" class="multi-chat-send">→</button>
                </form>
            </div>
        </aside>

        <!-- Vue lobby (avant démarrage) -->
        <section id="lobby-view" class="multi-view">
            <h1>Salle d'attente</h1>
            <p class="multi-share">
                Partage le lien :
                <input type="text" id="share-link" readonly />
                <button id="copy-link-btn">Copier</button>
            </p>
            <p id="lobby-info">En attente de joueurs…</p>
            <button id="start-game-btn" style="display:none;">Démarrer la partie</button>
        </section>

        <!-- Vue partie (pendant le jeu) -->
        <section id="game-view" class="multi-view" style="display:none;">
            <header class="multi-game-header">
                <span id="multi-progress"></span>
                <div id="multi-timer-wrapper">
                    <span id="multi-timer">30s</span>
                    <div id="multi-timer-bar"><div id="multi-timer-bar-fill"></div></div>
                </div>
                <button id="add-rounds-btn" style="display:none;">+5 manches</button>
            </header>

            <h2 id="message"></h2>
            <div id="content"></div>

            <input type="text" id="user-input" placeholder="Votre réponse..." autocomplete="off" />

            <div id="button-container">
                <button id="hint-button">Indice</button>
                <button id="multi-check-btn">Valider</button>
            </div>
        </section>

        <!-- Vue résultats (fin de partie) -->
        <section id="results-view" class="multi-view" style="display:none;">
            <h1>🏆 Classement final</h1>
            <ol id="final-ranking"></ol>
            <button id="extend-rounds-btn" style="display:none;">Prolonger (+5 manches)</button>
            <button id="back-to-lobby-btn">Retour à l'accueil</button>
        </section>

    </div>
</body>

</html>
